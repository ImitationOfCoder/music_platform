services:
    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql
        networks:
            - music_platform-network

    postgres-migrate:
        image: migrate/migrate:v4.19.1
        volumes:
            - ./migrations:/migrations

    port-forwarder:
        image: alpine/socat:1.8.0.3
        container_name: postgres-port-forwarder
        command: tcp-listen:${POSTGRES_PORT},fork,reuseaddr tcp-connect:postgres:${POSTGRES_PORT}
        ports:
            - "127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}"

volumes:
    postgres_data:
        driver: local

networks:
    music_platform-network:
        driver: bridge
