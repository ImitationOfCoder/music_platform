services:
    account-postgres:
        image: postgres:18-alpine
        container_name: account-postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DATABASE}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - account_postgres_data:/var/lib/postgresql
        networks:
            - music_platform-network
        restart: unless-stopped

volumes:
    account_postgres_data:
        driver: local

networks:
    music_platform-network:
        external: true